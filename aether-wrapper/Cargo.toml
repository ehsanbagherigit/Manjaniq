[package]
name = "aether-jni"
version = "0.1.0"
edition = "2021"
description = "Manjaniq JNI wrapper for Aether v2.3.0"
license = "AGPL-3.0-only"

[lib]
name = "aether"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Pin to exact v2.3.0 tag via git - CI has full internet egress
aether = { git = "https://github.com/CluvexStudio/Aether", tag = "v2.3.0" }
jni = "0.21.1"
serde_json = "1"

# Build requirements documented in aether/README.md:
# Rust 1.98+, CMake, C++ compiler, Perl required for BoringSSL
# Android NDK provides clang + cmake + perl
