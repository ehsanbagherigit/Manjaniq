[package]
name = "aether-jni"
version = "0.1.0"
edition = "2021"
description = "Manjaniq JNI wrapper for Aether v2.3.0"
license = "AGPL-3.0-only"

[lib]
name = "aether"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# Path-pinned to vendored third_party/Aether (v2.3.0 peeled 6175b67). Avoids git fetch
# and allows rust-version patch (1.98 -> 1.56) for CI stable.
#
# `features = ["tor"]` is the difference between the tor flags existing and them
# working. aether/src/tor.rs compiles `run_chain` / `run_only` / `start_reverse`
# only under that feature and otherwise returns
# "this build has no tor support" (tor.rs:191-211), so `--tor`, `--tor-reverse`
# and `--tor-only` would be accepted by cli.rs and then fail at run time. Upstream
# builds every shipped binary with it - desktop, musl, armv7 and the Android legs
# (`cargo ndk -t <abi> --platform 24 build --release --features tor`,
# third_party/Aether/.github/workflows/release.yml:529) - and the Dockerfile does
# the same (Dockerfile:31). The flag reaches the app through
# `AetherEngineOptions.AetherTorOptions`, whose code points at the very same
# source, so the build and the configuration model agree.
#
# The feature pulls arti-client 0.46 (already in third_party/Aether/aether/Cargo.lock)
# with `pt-client` for pluggable transports and `static-sqlite` for tor's state,
# plus liblzma for compressed directory documents. The transport binaries
# themselves are not Rust: they are built by scripts/ci/build_helpers.sh and
# packaged beside libaether.so.
aether = { path = "../third_party/Aether/aether", features = ["tor"] }
jni = "0.21.1"
serde_json = "1"

# Build requirements documented in aether/README.md:
# CMake, C++ compiler, Perl required for BoringSSL (NDK provides clang)
