name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;25.2.9519653"

      - name: Build Native Library
        run: |
          mkdir -p native/arm64-v8a
          # Configure CGO for Android ARM64 using the NDK toolchain
          export CGO_ENABLED=1
          export GOOS=android
          export GOARCH=arm64
          
          # Derive NDK toolchain path
          NDK_PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          if [ ! -d "$NDK_PATH" ]; then
            echo "NDK path not found: $NDK_PATH"
            exit 1
          fi
          
          export CC="$NDK_PATH/bin/aarch64-linux-android29-clang"
          export CXX="$NDK_PATH/bin/aarch64-linux-android29-clang++"
          
          go build -buildmode=c-shared -o native/arm64-v8a/libmanjaniq_native.so native/bridge.go


      - name: Verify Native Library
        run: |
          bash native/verify_native_lib.sh native/arm64-v8a/libmanjaniq_native.so

      - name: Run Go Tests
        run: go test -v ./engine/rstaspoof

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: manjaniq-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
