name: Build Debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Locate Android SDK Manager
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK Manager was not found."
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "SDK manager found: $SDKMANAGER"

      - name: Accept Android SDK Licenses
        run: |
          yes | "$SDKMANAGER" --licenses || {
            echo "License acceptance failed."
            exit 1
          }

      - name: Install Android SDK Components and NDK
        run: |
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Verify Android NDK
        run: |
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          echo "Android NDK and ARM64 compiler are ready."

      - name: Test Go engine package
        run: |
          set -euo pipefail
          # The genuine RSTA engine source must be tracked at
          # engine/rstaspoof/ (package manjaniq/engine/rstaspoof,
          # imported by native/bridge.go). It was missing from GitHub
          # for a long time because .gitignore contained "/engine/".
          # Fail with an actionable message instead of a bare
          # "cannot find package" if it is absent again.
          if [ ! -d engine/rstaspoof ] || ! ls engine/rstaspoof/*.go >/dev/null 2>&1; then
            echo "::error title=Genuine engine source missing::engine/rstaspoof/*.go not found in this checkout. Commit the genuine RSTA engine sources (engine.go, config.go, proxy.go, tls.go, bypass.go, ...) to engine/rstaspoof/ -- source files only, without any nested .git directory or prebuilt binaries -- then re-run. See DEVELOPMENT_LOG.md (2026-10-18)."
            exit 1
          fi
          # Module mode (go.mod at the repo root declares "module
          # manjaniq"); validates that the engine package imported by
          # native/bridge.go resolves and passes its tests on the host
          # before the Android cross-compile below.
          export GO111MODULE=on
          go test ./engine/...

      - name: Build Native Library (arm64-v8a)
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          export CGO_ENABLED=1
          export GOOS=android
          export GOARCH=arm64
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          # Module mode is required: bridge.go imports
          # "manjaniq/engine/rstaspoof". GO111MODULE=off broke that
          # import ("cannot find package") because there is no GOPATH
          # checkout. Run from the repo root so ./native resolves
          # against the root go.mod.
          export GO111MODULE=on
          # Build the whole ./native package (bridge.go + bridge.c).
          # Building only ./native/bridge.go silently drops the C wrapper and
          # leaves NewStringUTF_wrapper undefined, which makes dlopen fail on
          # Android with "cannot locate symbol".
          go build \
            -buildmode=c-shared \
            -o app/src/main/jniLibs/arm64-v8a/libmanjaniq_native.so \
            ./native

      - name: Verify native library
        run: |
          set -euo pipefail
          bash native/verify_native_lib.sh

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/debug/*.apk)"
          test -n "$APK"
          echo "Checking $APK"
          unzip -l "$APK" > /tmp/apk_listing.txt
          grep -q "classes.dex" /tmp/apk_listing.txt
          grep -q "lib/arm64-v8a/libmanjaniq_native.so" /tmp/apk_listing.txt
          rm -rf /tmp/apkcheck
          mkdir -p /tmp/apkcheck
          unzip -o -q "$APK" "lib/arm64-v8a/*" -d /tmp/apkcheck
          bash native/verify_native_lib.sh /tmp/apkcheck/lib/arm64-v8a/libmanjaniq_native.so

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: manjaniq-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
