name: Build Debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Locate Android SDK Manager
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK Manager was not found."
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "SDK manager found: $SDKMANAGER"

      - name: Accept Android SDK Licenses
        run: |
          yes | "$SDKMANAGER" --licenses || {
            echo "License acceptance failed."
            exit 1
          }

      - name: Install Android SDK Components and NDK
        run: |
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Verify Android NDK
        run: |
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          echo "Android NDK and ARM64 compiler are ready."

      - name: Test Go engine package
        run: |
          set -euo pipefail
          if [ ! -d engine/rstaspoof ] || ! ls engine/rstaspoof/*.go >/dev/null 2>&1; then
            echo "::error title=Genuine engine source missing::engine/rstaspoof/*.go not found in this checkout. Commit the genuine RSTA engine sources (engine.go, config.go, proxy.go, tls.go, bypass.go, ...) to engine/rstaspoof/ -- source files only, without any nested .git directory or prebuilt binaries -- then re-run. See DEVELOPMENT_LOG.md (2026-10-18)."
            exit 1
          fi
          export GO111MODULE=on
          if ! go test -count=3 -timeout 240s -v ./engine/... 2>&1 | tee /tmp/gotest.log; then
            echo "::error title=Go tests failed::go test ./engine/... failed; context lines follow as annotations"
            grep -E "STUCK |DIAG |did not finish|--- FAIL:|panic:" /tmp/gotest.log | head -60 > /tmp/gotest.ctx || true
            if [ ! -s /tmp/gotest.ctx ]; then tail -n 60 /tmp/gotest.log > /tmp/gotest.ctx; fi
            while IFS= read -r line; do
              printf '::error::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')"
            done < /tmp/gotest.ctx
            exit 1
          fi

      - name: Build Native Library (arm64-v8a)
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          export CGO_ENABLED=1
          export GOOS=android
          export GOARCH=arm64
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export GO111MODULE=on
          go build \
            -buildmode=c-shared \
            -o app/src/main/jniLibs/arm64-v8a/libmanjaniq_native.so \
            ./native

      - name: Verify native library
        run: |
          set -euo pipefail
          bash native/verify_native_lib.sh

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/gradle_test.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error title=Gradle unit tests failed::exit code $EXIT_CODE — see artifact gradle-test-log"
            # Surface top lines as annotations (blob logs are blocked in some sandboxes)
            grep -E "e:|error:|FAILED|Execution failed|Build failed" /tmp/gradle_test.log | head -80 > /tmp/gradle_err.txt || true
            if [ -s /tmp/gradle_err.txt ]; then
              while IFS= read -r line; do
                printf '::error::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g' | cut -c1-800)"
              done < /tmp/gradle_err.txt
            else
              tail -n 80 /tmp/gradle_test.log > /tmp/gradle_tail.txt
              while IFS= read -r line; do
                printf '::error::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g' | cut -c1-800)"
              done < /tmp/gradle_tail.txt
            fi
            exit $EXIT_CODE
          fi

      - name: Upload Gradle test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-log
          path: /tmp/gradle_test.log
          if-no-files-found: warn

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/debug/*.apk)"
          test -n "$APK"
          echo "Checking $APK"
          unzip -l "$APK" > /tmp/apk_listing.txt
          grep -q "classes.dex" /tmp/apk_listing.txt
          grep -q "lib/arm64-v8a/libmanjaniq_native.so" /tmp/apk_listing.txt
          rm -rf /tmp/apkcheck
          mkdir -p /tmp/apkcheck
          unzip -o -q "$APK" "lib/arm64-v8a/*" -d /tmp/apkcheck
          bash native/verify_native_lib.sh /tmp/apkcheck/lib/arm64-v8a/libmanjaniq_native.so

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: manjaniq-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
