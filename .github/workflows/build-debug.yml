name: Build Debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Locate Android SDK Manager
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK Manager was not found."
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "SDK manager found: $SDKMANAGER"

      - name: Accept Android SDK Licenses
        run: |
          yes | "$SDKMANAGER" --licenses || {
            echo "License acceptance failed."
            exit 1
          }

      - name: Install Android SDK Components and NDK
        run: |
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Verify Android NDK
        run: |
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          echo "Android NDK and ARM64 compiler are ready."

      - name: Test Go engine package
        run: |
          set -euo pipefail
          if [ ! -d engine/rstaspoof ] || ! ls engine/rstaspoof/*.go >/dev/null 2>&1; then
            echo "::error title=Genuine engine source missing::engine/rstaspoof/*.go not found in this checkout. Commit the genuine RSTA engine sources (engine.go, config.go, proxy.go, tls.go, bypass.go, ...) to engine/rstaspoof/ -- source files only, without any nested .git directory or prebuilt binaries -- then re-run. See DEVELOPMENT_LOG.md (2026-10-18)."
            exit 1
          fi
          export GO111MODULE=on
          if ! go test -count=3 -timeout 240s -v ./engine/... 2>&1 | tee /tmp/gotest.log; then
            echo "::error title=Go tests failed::go test ./engine/... failed; context lines follow as annotations"
            grep -E "STUCK |DIAG |did not finish|--- FAIL:|panic:" /tmp/gotest.log | head -60 > /tmp/gotest.ctx || true
            if [ ! -s /tmp/gotest.ctx ]; then tail -n 60 /tmp/gotest.log > /tmp/gotest.ctx; fi
            while IFS= read -r line; do
              printf '::error::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')"
            done < /tmp/gotest.ctx
            exit 1
          fi

      - name: Build Native Libraries (arm64-v8a + x86_64)
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          export CGO_ENABLED=1
          export GOOS=android
          export GO111MODULE=on
          # arm64-v8a
          export GOARCH=arm64
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          go build \
            -buildmode=c-shared \
            -o app/src/main/jniLibs/arm64-v8a/libmanjaniq_native.so \
            ./native
          # x86_64 (for emulator smoke test)
          export GOARCH=amd64
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
          go build \
            -buildmode=c-shared \
            -o app/src/main/jniLibs/x86_64/libmanjaniq_native.so \
            ./native
          ls -lh app/src/main/jniLibs/arm64-v8a/ app/src/main/jniLibs/x86_64/

      - name: Verify native library
        run: |
          set -euo pipefail
          bash native/verify_native_lib.sh

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/gradle_test.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error title=Gradle unit tests failed::exit code $EXIT_CODE — see artifact gradle-test-log"
            # Surface top lines as annotations (blob logs are blocked in some sandboxes)
            grep -E "e:|error:|FAILED|Execution failed|Build failed" /tmp/gradle_test.log | head -80 > /tmp/gradle_err.txt || true
            if [ -s /tmp/gradle_err.txt ]; then
              while IFS= read -r line; do
                printf '::error::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g' | cut -c1-800)"
              done < /tmp/gradle_err.txt
            else
              tail -n 80 /tmp/gradle_test.log > /tmp/gradle_tail.txt
              while IFS= read -r line; do
                printf '::error::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g' | cut -c1-800)"
              done < /tmp/gradle_tail.txt
            fi
            exit $EXIT_CODE
          fi

      - name: Upload Gradle test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-log
          path: /tmp/gradle_test.log
          if-no-files-found: warn

      - name: Comment Gradle failure on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('/tmp/gradle_test.log', 'utf8'); } catch(e) { log = 'Could not read /tmp/gradle_test.log: ' + e; }
            // Trim to fit GitHub comment limit (max 65536), take last 400 lines + first 200
            const lines = log.split('\n');
            let excerpt;
            if (lines.length > 600) {
              excerpt = lines.slice(0, 200).join('\n') + '\n...[truncated]...\n' + lines.slice(-400).join('\n');
            } else {
              excerpt = log;
            }
            // Escape for markdown
            excerpt = excerpt.slice(0, 60000);
            const body = `### ❌ Gradle unit tests failed in \`${process.env.GITHUB_WORKFLOW}\` @ \`${context.sha.slice(0,7)}\`\n\n<details><summary>Gradle log (last run)</summary>\n\n\`\`\`\n${excerpt}\n\`\`\`\n\n</details>\n\nPlease fix compilation/test errors and push again.`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/debug/*.apk)"
          test -n "$APK"
          echo "Checking $APK"
          unzip -l "$APK" > /tmp/apk_listing.txt
          cat /tmp/apk_listing.txt
          grep -q "classes.dex" /tmp/apk_listing.txt
          grep -q "lib/arm64-v8a/libmanjaniq_native.so" /tmp/apk_listing.txt
          grep -q "lib/x86_64/libmanjaniq_native.so" /tmp/apk_listing.txt
          # Verify launcher icon inside APK (regression for missing icon bug)
          grep -q "mipmap.*ic_launcher" /tmp/apk_listing.txt || grep -q "res/mipmap" /tmp/apk_listing.txt
          unzip -l "$APK" | grep -i "ic_launcher" || echo "No ic_launcher entry found — check mipmap packaging"
          rm -rf /tmp/apkcheck
          mkdir -p /tmp/apkcheck
          unzip -o -q "$APK" "lib/arm64-v8a/*" -d /tmp/apkcheck
          bash native/verify_native_lib.sh /tmp/apkcheck/lib/arm64-v8a/libmanjaniq_native.so

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: manjaniq-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Startup smoke test on real Android framework — catches launch crashes that
  # unit tests cannot (e.g., LocaleHelper mutating shared Configuration caused
  # immediate exit after install but left build+unit tests green).
  # NOTE: Previous failure was "Timeout waiting for emulator to boot" — caused by
  # installing system-images manually with `default` target + oversized RAM (4096M)
  # and missing GPU/KVM options. Fixed below to let runner manage AVD with google_apis.
  emulator-smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -lh /dev/kvm || echo "KVM not available - emulator will be slow"
          egrep -c '(vmx|svm)' /proc/cpuinfo || echo "No VMX/SVM"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Configure Android SDK
        run: echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Locate Android SDK Manager
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK Licenses
        run: yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK Components and NDK
        run: |
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Build native libs for emulator (arm64 + x86_64)
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          export CGO_ENABLED=1 GOOS=android GO111MODULE=on
          export GOARCH=arm64 CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          go build -buildmode=c-shared -o app/src/main/jniLibs/arm64-v8a/libmanjaniq_native.so ./native
          export GOARCH=amd64 CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
          go build -buildmode=c-shared -o app/src/main/jniLibs/x86_64/libmanjaniq_native.so ./native

      - name: Free disk space for emulator
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost 2>/dev/null || true
          df -h

      - name: Run instrumented smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          cores: 2
          avd-name: manjaniq-avd
          force-avd-creation: true
          emulator-boot-timeout: 900
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            chmod +x gradlew
            echo "=== ADB devices before test ==="
            adb devices
            echo "=== Running connectedDebugAndroidTest ==="
            set +e
            ./gradlew connectedDebugAndroidTest --stacktrace 2>&1 | tee $GITHUB_WORKSPACE/connected.log
            TEST_EXIT=${PIPESTATUS[0]}
            echo "=== Graduated with exit $TEST_EXIT ==="
            echo "=== Test log tail (last 500 lines) ==="
            tail -n 500 $GITHUB_WORKSPACE/connected.log || true
            echo "=== Logcat after test ==="
            adb logcat -d > $GITHUB_WORKSPACE/logcat_connected.txt 2>&1 || true
            tail -n 300 $GITHUB_WORKSPACE/logcat_connected.txt || true
            if [ "$TEST_EXIT" -ne 0 ]; then
              echo "::error::connectedDebugAndroidTest failed with $TEST_EXIT"
              echo "=== Failure diagnostics ==="
              grep -i -E "FAIL|error|Exception|AndroidRuntime|FATAL|manjaniq" $GITHUB_WORKSPACE/connected.log | tail -n 100 || true
              grep -i -E "AndroidRuntime|FATAL|manjaniq|LocaleHelper" $GITHUB_WORKSPACE/logcat_connected.txt | tail -n 100 || true
              exit $TEST_EXIT
            fi
            echo "=== Manual launch verification (after successful test) ==="
            adb shell pm list packages | grep manjaniq || true
            adb shell am start -n com.manjaniq/.MainActivity
            echo "am start exit: $?"
            sleep 5
            # Use dumpsys instead of pidof (pidof not always available)
            adb shell dumpsys activity activities | grep -i manjaniq | head -n 20 || true
            adb shell ps | grep manjaniq || true
            # Only fail if logcat shows actual crash, not just process not in foreground
            if adb logcat -d | grep -i -E "AndroidRuntime.*manjaniq|FATAL.*manjaniq|AndroidRuntime.*FATAL" | grep -v "TestRunner" | head -n 5 | grep -q .; then
              echo "::error::App crashed after manual launch"
              adb logcat -d | grep -i -E "AndroidRuntime|FATAL|manjaniq|LocaleHelper" | tail -n 200 || true
              exit 1
            fi
            adb logcat -d > $GITHUB_WORKSPACE/logcat_final.txt 2>&1 || true
            cat $GITHUB_WORKSPACE/logcat_final.txt | tail -n 100 || true
            echo "=== Manual launch OK (no crash) ==="
            echo "=== All checks passed ==="

      - name: Dump connected log on failure (visible via annotations without blob)
        if: failure()
        run: |
          echo "===== connected.log line count ====="
          wc -l connected.log || echo "no wc"
          echo "===== connected.log last 800 lines ====="
          tail -n 800 connected.log 2>&1 | tail -n 800 || echo "no connected.log"
          echo "===== FAILURE context ====="
          grep -n -A 30 "What went wrong" connected.log | head -n 200 > /tmp/what.txt || true
          cat /tmp/what.txt || echo "no What went wrong"
          echo "===== Failing tests detail ====="
          grep -n -B 5 -A 30 "failing tests\|FAILURE: Build failed\|There were failing" connected.log | head -n 300 > /tmp/fail_detail.txt || true
          cat /tmp/fail_detail.txt || echo "no fail detail"
          echo "===== Test reports ====="
          find app/build -name "*.xml" -path "*androidTest*" 2>/dev/null | head -20
          find app/build/reports -type f -name "*.html" 2>/dev/null | head -20
          # Dump XML test results if any — handle spaces in path (emulator serial contains space)
          find app/build -name "TEST-*.xml" -print0 2>/dev/null | xargs -0 -I {} sh -c 'echo "=== {} ==="; cat "{}" | head -n 400' 2>&1 | head -n 800 || echo "no TEST xml"
          find app/build -type f -name "*.xml" 2>/dev/null | head -20
          # Dump HTML report snippet
          if [ -f app/build/reports/androidTests/connected/debug/index.html ]; then
            echo "=== HTML report snippet ==="
            grep -A 5 -B 5 "failures\|LaunchSmokeTest\|mainActivity\|launcherIcon\|localeHelper" app/build/reports/androidTests/connected/debug/index.html | head -n 150 || true
          fi
          find app/build/reports -name "index.html" 2>/dev/null | xargs -I {} sh -c 'echo "=== {} ==="; grep -n "failures\|LaunchSmokeTest" "{}" | head -n 100' 2>&1 | head -n 200 || true
          echo "===== Surfacing as annotations ====="
          cat /tmp/what.txt /tmp/fail_detail.txt 2>/dev/null | head -n 100 > /tmp/ann.txt || tail -n 100 connected.log > /tmp/ann.txt
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "$line" | grep -qE "^[[:space:]]*$" && continue
            printf '::error::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g' | cut -c1-900)"
          done < /tmp/ann.txt
          tail -n 80 connected.log | while IFS= read -r line; do echo "::warning::tail: $line"; done || true
          # Also surface test XML as annotations — handle spaces
          find app/build -name "TEST-*.xml" -print0 2>/dev/null | xargs -0 -I {} sh -c 'echo "=== {} ==="; grep -E "testcase|failure|system-out|system-err" "{}" | head -n 40' 2>&1 | while read l; do printf "::error::[test xml] %s\n" "$(printf "%s" "$l" | sed "s/%/%25/g; s/\r/%0D/g" | cut -c1-900)"; done || true
          grep -n -E "BUILD FAILED|There were failing|FAILURE|Exception|AssertionFailed" connected.log | head -n 30 | while IFS= read -r line; do printf '::error::[connected] %s\n' "$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g' | cut -c1-900)"; done || true

      - name: Publish failure excerpt as PR comment (if PR)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('connected.log', 'utf8'); } catch(e) { log = 'no connected.log: ' + e; }
            const tail = log.split('\n').slice(-300).join('\n').slice(0, 60000);
            const body = `### ❌ Emulator smoke test failed @ \`${context.sha.slice(0,7)}\`\n\n<details><summary>connected.log tail</summary>\n\n\`\`\`\n${tail}\n\`\`\`\n\n</details>`;
            github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics
          path: |
            connected.log
            logcat_connected.txt
            logcat_final.txt
          if-no-files-found: warn

      - name: Upload logcat on failure (legacy)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: /tmp/logcat.txt
          if-no-files-found: warn
